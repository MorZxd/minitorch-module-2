name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt black==22.6.0 darglint==1.8.1 flake8==5.0.4 isort==5.10.1 pep8-naming==0.13.3 -e .
      - run: python -m pytest -q
      - run: mypy minitorch tests
      - run: black --check minitorch tests project/run_tensor.py
      - run: isort --check-only minitorch tests project/run_tensor.py
      - run: flake8 minitorch tests project/run_tensor.py
      - run: darglint minitorch/*.py project/run_tensor.py
